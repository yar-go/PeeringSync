
<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PeeringSync</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
  <h1>PeeringSync</h1>

  <!-- Кнопка для додавання учасників -->
  <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#add_peers">Додати учасників</button>

  <!-- Кнопка для додавання мережі -->
  <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addNetwork">Додати мережу</button>

  <!-- Кнопка для видалення мережі -->
  <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#deleteNetwork">Видалити мережу</button>

  <!-- Кнопка для оновлення файлів -->
  <button class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#updateFiles">Оновити файли</button>
</div>

<!-- Модальні вікна -->

<!-- Додавання учасників -->
<div class="modal fade" id="add_peers" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form method="POST" action="/add_peers">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="exampleModalLabel">Додавання нових учасників</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            <div class="mb-3">
              <label for="peers_addresses" class="form-label">Адреси нових учасників</label>
              <textarea class="form-control" id="peers_addresses" name="peers_addresses" rows="3"></textarea>
            </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Відміна</button>
          <button type="submit" class="btn btn-primary">Відправити</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Додавання мережі -->
<div class="modal modal-lg fade" id="addNetwork" tabindex="-1" aria-labelledby="addNetworkLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form method="POST" action="/add_network" enctype="multipart/form-data">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="addNetworkLabel">Додавання мережі</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="network_name" class="form-label">Назва мережі:</label>
            <input type="text" class="form-control" id="network_name" name="network_name">
          </div>
          <div class="mb-3">
            <label for="save_path" class="form-label">Шлях до теки збереження:</label>
            <input type="text" class="form-control" id="save_path" name="save_path">
          </div>
          <hr>
          <div class="mb-3">
            <label for="public_key" class="form-label">Публічний ключ:</label>
            <input class="form-control form-control-sm" id="public_key" name="public_key" type="file">
          </div>
          <div class="mb-3">
            <label for="private_key" class="form-label">Приватний ключ:</label>
            <input class="form-control form-control-sm" id="private_key" name="private_key" type="file">
          </div>
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" role="switch" id="switchCheckKeysCreate">
            <label class="form-check-label" for="switchCheckKeysCreate">Згенерувати нові</label>
          </div>
          <hr>
          <div class="mb-3">
            <label for="new_peers" class="form-label">Адреси нових учасників</label>
            <textarea class="form-control" id="new_peers" name="new_peers" rows="3"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Відміна</button>
          <button type="submit" class="btn btn-primary">Додати</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Видалення мережі -->
<div class="modal fade" id="deleteNetwork" tabindex="-1" aria-labelledby="deleteNetworkLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form method="POST" action="/delete_network">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="deleteNetworkLabel">Видалити мережу</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          Ви впевнені?
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-danger">Так</button>
          <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Ні</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Оновлення файлів -->
<div class="modal fade" id="updateFiles" tabindex="-1" aria-labelledby="updateFilesLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form method="POST" action="/update_files">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="updateFilesLabel">Оновити файли</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          Оновити файли роздачі?
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Ні</button>
          <button type="submit" class="btn btn-primary">Так</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
